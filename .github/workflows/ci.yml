name: CI

on: push

jobs:
  ruby-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        entry:
          - name: Minimum Rails
            ruby: '3.2'
            gemfile: Gemfile.rails-min
          - name: Latest Rails
            ruby: '4.0'
            gemfile: Gemfile.rails-latest
          - name: Edge Rails
            ruby: '4.0'
            gemfile: "Gemfile.rails-edge"

    name: ${{ matrix.entry.name }}
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.entry.gemfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        name: Use Ruby ${{ matrix.entry.ruby }}
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true

      - name: 💅🏼 Lint
        run: bundle exec rubocop --fail-fast

      - name: Test
        run: bundle exec rake spec
